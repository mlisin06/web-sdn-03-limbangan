<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dasbor Admin - SDN 03 Limbangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Header / Navbar -->
  <header class="bg-blue-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg">Panel Pengelola Sekolah</h1>
        <p class="text-xs text-blue-100">SDN 03 Limbangan</p>
      </div>
      <div class="flex items-center gap-4">
        <span id="user-email" class="text-sm font-medium">Loading...</span>
        <button id="btn-logout" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition">
          Keluar
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Form Input Berita / Pengumuman -->
    <section class="bg-white p-6 rounded-xl shadow-sm border col-span-1">
      <h2 class="text-lg font-bold text-slate-800 mb-4">Tambah Pengumuman / Berita</h2>
      
      <form id="form-berita" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Judul Pengumuman</label>
          <input type="text" id="judul" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Isi Pesan / Informasi</label>
          <textarea id="isi" rows="4" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <button type="submit" id="btn-simpan" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg transition">
          Terbitkan ke Web Publik
        </button>
      </form>
    </section>

    <!-- Daftar Pengumuman Terbit -->
    <section class="bg-white p-6 rounded-xl shadow-sm border col-span-1 md:col-span-2">
      <h2 class="text-lg font-bold text-slate-800 mb-4">Daftar Pengumuman Terbit</h2>
      <div id="daftar-berita" class="space-y-3">
        <p class="text-slate-400 text-sm">Memuat data dari Firebase...</p>
      </div>
    </section>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyApWcOiW-N2pmC--kfefgpvCk5z6gLhnxo",
      authDomain: "sdn03limbangan-portal.firebaseapp.com",
      projectId: "sdn03limbangan-portal",
      storageBucket: "sdn03limbangan-portal.firebasestorage.app",
      messagingSenderId: "940789591995",
      appId: "1:940789591995:web:cc8355aa291e41a2d29e9e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const userEmailSpan = document.getElementById('user-email');
    const btnLogout = document.getElementById('btn-logout');
    const formBerita = document.getElementById('form-berita');
    const daftarBerita = document.getElementById('daftar-berita');

    // Cek Akses Login
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userEmailSpan.innerText = user.email;
        muatDataBerita();
      } else {
        window.location.href = 'login.html';
      }
    });

    // Logout
    btnLogout.addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = 'login.html');
    });

    // Simpan Data Pengumuman ke Firestore
    formBerita.addEventListener('submit', async (e) => {
      e.preventDefault();
      const judul = document.getElementById('judul').value;
      const isi = document.getElementById('isi').value;

      try {
        await addDoc(collection(db, "pengumuman"), {
          judul: judul,
          isi: isi,
          tanggal: serverTimestamp()
        });
        formBerita.reset();
        muatDataBerita();
      } catch (error) {
        alert("Gagal menyimpan data: " + error.message);
      }
    });

    // Ambil Data dari Firestore
    async function muatDataBerita() {
      daftarBerita.innerHTML = '<p class="text-slate-400 text-sm">Memuat data...</p>';
      try {
        const q = query(collection(db, "pengumuman"), orderBy("tanggal", "desc"));
        const querySnapshot = await getDocs(q);
        
        if(querySnapshot.empty) {
          daftarBerita.innerHTML = '<p class="text-slate-400 text-sm">Belum ada pengumuman.</p>';
          return;
        }

        daftarBerita.innerHTML = '';
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const item = document.createElement('div');
          item.className = 'p-4 border rounded-lg bg-slate-50';
          item.innerHTML = `
            <h3 class="font-bold text-slate-800">${data.judul}</h3>
            <p class="text-slate-600 text-sm mt-1">${data.isi}</p>
          `;
          daftarBerita.appendChild(item);
        });
      } catch (error) {
        daftarBerita.innerHTML = '<p class="text-red-500 text-sm">Gagal memuat pengumuman.</p>';
      }
    }
  </script>
</body>
</html>
