<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Pengelola Sekolah - SDN 03 Limbangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#0f1f38', dark: '#081120', light: '#1b335a' },
                        gold: { DEFAULT: '#d4af37', light: '#f3e5ab', dark: '#aa8c2c' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header Panel Admin -->
    <header class="bg-navy text-white px-6 py-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <div>
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap text-gold"></i>
                <span>Panel Pengelola Sekolah</span>
            </h1>
            <p class="text-xs text-gray-300">SDN 03 Limbangan</p>
        </div>
        <div class="flex items-center space-x-4">
            <span id="user-email" class="text-xs text-gold font-medium hidden sm:inline"></span>
            <button id="logout-btn" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
            </button>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Navigation Tabs -->
        <div class="flex border-b border-gray-300 mb-6 bg-white rounded-t-xl p-2 gap-2 shadow-sm">
            <button id="tab-news-btn" onclick="switchTab('news')" class="px-5 py-2.5 text-sm font-bold rounded-lg transition bg-navy text-white shadow">
                <i class="fa-solid fa-bullhorn mr-2"></i> Kelola Berita & Pengumuman
            </button>
            <button id="tab-events-btn" onclick="switchTab('events')" class="px-5 py-2.5 text-sm font-bold text-gray-600 hover:bg-gray-100 rounded-lg transition">
                <i class="fa-solid fa-calendar-days mr-2"></i> Kelola Agenda Kegiatan
            </button>
        </div>

        <!-- TAB 1: KELOLA BERITA -->
        <div id="tab-news" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Form Input Berita -->
            <div class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-bold text-navy mb-4 pb-2 border-b flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-gold"></i> Tambah Berita Baru
                </h2>
                <form id="news-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Judul Berita / Pengumuman</label>
                        <input type="text" id="news-title" required placeholder="Contoh: Pengumuman Pembagian Rapor" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-navy outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Isi Pesan / Informasi</label>
                        <textarea id="news-content" rows="5" required placeholder="Tuliskan rinci informasi pengumuman..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-navy outline-none"></textarea>
                    </div>
                    <button type="submit" id="submit-news-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg text-sm transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Terbitkan ke Web Utama
                    </button>
                </form>
            </div>

            <!-- Daftar Berita Terbit -->
            <div class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-bold text-navy mb-4 pb-2 border-b flex items-center justify-between">
                    <span><i class="fa-solid fa-list-check text-gold"></i> Daftar Berita Terbit</span>
                </h2>
                <div id="news-list" class="space-y-4">
                    <p class="text-gray-400 text-sm">Memuat data...</p>
                </div>
            </div>
        </div>

        <!-- TAB 2: KELOLA AGENDA -->
        <div id="tab-events" class="grid grid-cols-1 lg:grid-cols-12 gap-8 hidden">
            <!-- Form Input Agenda -->
            <div class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-bold text-navy mb-4 pb-2 border-b flex items-center gap-2">
                    <i class="fa-solid fa-calendar-plus text-gold"></i> Tambah Agenda Kegiatan
                </h2>
                <form id="events-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Judul Agenda / Kegiatan</label>
                        <input type="text" id="event-title" required placeholder="Contoh: Open House & Sosialisasi" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-navy outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Tanggal & Waktu Kegiatan</label>
                        <input type="text" id="event-date" required placeholder="Contoh: Nov 20, 2026 - 08:00 WIB" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-navy outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Deskripsi Singkat</label>
                        <textarea id="event-desc" rows="4" required placeholder="Keterangan singkat kegiatan..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-navy outline-none"></textarea>
                    </div>
                    <button type="submit" id="submit-event-btn" class="w-full bg-gold hover:bg-gold-dark text-navy font-bold py-3 rounded-lg text-sm transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-calendar-check"></i> Simpan Agenda
                    </button>
                </form>
            </div>

            <!-- Daftar Agenda Terbit -->
            <div class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-bold text-navy mb-4 pb-2 border-b">
                    <i class="fa-solid fa-calendar-day text-gold"></i> Daftar Agenda Terbit
                </h2>
                <div id="events-list" class="space-y-4">
                    <p class="text-gray-400 text-sm">Memuat data agenda...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApWcOiW-N2pmC--kfefgpvCk5z6gLhnxo",
            authDomain: "sdn03limbangan-portal.firebaseapp.com",
            projectId: "sdn03limbangan-portal",
            storageBucket: "sdn03limbangan-portal.firebasestorage.app",
            messagingSenderId: "940789591995",
            appId: "1:940789591995:web:cc8355aa291e41a2d29e9e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Cek Login State
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                document.getElementById('user-email').innerText = user.email;
            }
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "login.html");
        });

        // Toggle Tab
        window.switchTab = function(tabName) {
            if (tabName === 'news') {
                document.getElementById('tab-news').classList.remove('hidden');
                document.getElementById('tab-events').classList.add('hidden');
                document.getElementById('tab-news-btn').className = "px-5 py-2.5 text-sm font-bold rounded-lg transition bg-navy text-white shadow";
                document.getElementById('tab-events-btn').className = "px-5 py-2.5 text-sm font-bold text-gray-600 hover:bg-gray-100 rounded-lg transition";
            } else {
                document.getElementById('tab-news').classList.add('hidden');
                document.getElementById('tab-events').classList.remove('hidden');
                document.getElementById('tab-events-btn').className = "px-5 py-2.5 text-sm font-bold rounded-lg transition bg-navy text-white shadow";
                document.getElementById('tab-news-btn').className = "px-5 py-2.5 text-sm font-bold text-gray-600 hover:bg-gray-100 rounded-lg transition";
            }
        };

        // --- MANAJEMEN BERITA ---
        const newsForm = document.getElementById('news-form');
        newsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('news-title').value;
            const content = document.getElementById('news-content').value;
            try {
                await addDoc(collection(db, "announcements"), {
                    title: title,
                    content: content,
                    createdAt: serverTimestamp()
                });
                newsForm.reset();
            } catch (err) {
                alert("Gagal menerbitkan berita: " + err.message);
            }
        });

        onSnapshot(query(collection(db, "announcements"), orderBy("createdAt", "desc")), (snapshot) => {
            const list = document.getElementById('news-list');
            if (snapshot.empty) {
                list.innerHTML = '<p class="text-gray-400 text-sm italic">Belum ada berita terbit.</p>';
                return;
            }
            let html = '';
            snapshot.forEach((documentSnap) => {
                const data = documentSnap.data();
                html += `
                    <div class="p-4 rounded-xl border border-gray-200 bg-gray-50 flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-navy text-sm">${data.title}</h3>
                            <p class="text-xs text-gray-600 mt-1 whitespace-pre-line">${data.content}</p>
                        </div>
                        <button onclick="deleteItem('announcements', '${documentSnap.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold p-1">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            });
            list.innerHTML = html;
        });

        // --- MANAJEMEN AGENDA ---
        const eventsForm = document.getElementById('events-form');
        eventsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('event-title').value;
            const dateStr = document.getElementById('event-date').value;
            const desc = document.getElementById('event-desc').value;
            try {
                await addDoc(collection(db, "events"), {
                    title: title,
                    dateStr: dateStr,
                    description: desc,
                    createdAt: serverTimestamp()
                });
                eventsForm.reset();
            } catch (err) {
                alert("Gagal menyimpan agenda: " + err.message);
            }
        });

        onSnapshot(query(collection(db, "events"), orderBy("createdAt", "desc")), (snapshot) => {
            const list = document.getElementById('events-list');
            if (snapshot.empty) {
                list.innerHTML = '<p class="text-gray-400 text-sm italic">Belum ada agenda terbit.</p>';
                return;
            }
            let html = '';
            snapshot.forEach((documentSnap) => {
                const data = documentSnap.data();
                html += `
                    <div class="p-4 rounded-xl border border-gray-200 bg-gray-50 flex justify-between items-start">
                        <div>
                            <span class="text-gold text-xs font-bold">${data.dateStr}</span>
                            <h3 class="font-bold text-navy text-sm mt-0.5">${data.title}</h3>
                            <p class="text-xs text-gray-600 mt-1">${data.description}</p>
                        </div>
                        <button onclick="deleteItem('events', '${documentSnap.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold p-1">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            });
            list.innerHTML = html;
        });

        // Fungsi Hapus Global
        window.deleteItem = async function(collName, id) {
            if (confirm("Apakah Anda yakin ingin menghapus item ini?")) {
                await deleteDoc(doc(db, collName, id));
            }
        };
    </script>
</body>
</html>
