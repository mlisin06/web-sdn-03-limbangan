<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin & Guru - SDN 03 Limbangan</title>
    
    <link id="dynamic-favicon" rel="icon" type="image/jpeg" href="https://i.ibb.co.com/0pG9fmFg/logo-sekolah.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#0f1f38', dark: '#081120', light: '#1b335a' },
                        gold: { DEFAULT: '#d4af37', light: '#f3e5ab', dark: '#aa8c2c' }
                    },
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">

    <!-- HEADER PANEL ADMIN -->
    <header class="bg-navy text-white sticky top-0 z-50 shadow-md border-b border-gold/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="w-10 h-10 rounded-full bg-gradient-to-tr from-gold to-gold-light flex items-center justify-center text-navy shadow overflow-hidden">
                    <img src="https://i.ibb.co.com/0pG9fmFg/logo-sekolah.jpg" class="w-full h-full object-cover" alt="Logo Sekolah">
                </a>
                <div>
                    <h1 class="font-serif text-white text-base sm:text-lg font-bold leading-tight">PANEL GURU & ADMIN</h1>
                    <p class="text-gold text-[10px] sm:text-xs font-semibold tracking-widest uppercase">SD NEGERI 03 LIMBANGAN</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <a href="index.html" class="bg-navy-light hover:bg-navy-dark text-gray-200 border border-gold/30 px-3 py-2 rounded-lg text-xs font-medium transition flex items-center space-x-2">
                    <i class="fa-solid fa-globe text-gold"></i>
                    <span class="hidden sm:inline">Lihat Website</span>
                </a>
            </div>
        </div>
    </header>

    <!-- NAVIGASI TAB MODUL ADMIN -->
    <nav class="bg-navy-dark text-white border-b border-gold/20 overflow-x-auto">
        <div class="max-w-7xl mx-auto px-4 flex space-x-2 whitespace-nowrap py-3">
            <button onclick="switchTab('settings')" id="nav-settings" class="tab-btn active-tab bg-gold text-navy font-bold px-4 py-2 rounded-lg text-xs transition flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> Pengaturan Web & Logo
            </button>
            <button onclick="switchTab('exam')" id="nav-exam" class="tab-btn text-gray-300 hover:text-white font-medium px-4 py-2 rounded-lg text-xs transition flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square"></i> Kelola Soal & Ujian
            </button>
            <button onclick="switchTab('students')" id="nav-students" class="tab-btn text-gray-300 hover:text-white font-medium px-4 py-2 rounded-lg text-xs transition flex items-center gap-2">
                <i class="fa-solid fa-users"></i> Kelola Data Siswa
            </button>
            <button onclick="switchTab('subjects')" id="nav-subjects" class="tab-btn text-gray-300 hover:text-white font-medium px-4 py-2 rounded-lg text-xs transition flex items-center gap-2">
                <i class="fa-solid fa-book"></i> Kelola Mapel
            </button>
            <button onclick="switchTab('grades')" id="nav-grades" class="tab-btn text-gray-300 hover:text-white font-medium px-4 py-2 rounded-lg text-xs transition flex items-center gap-2">
                <i class="fa-solid fa-file-signature"></i> Input Nilai Siswa
            </button>
        </div>
    </nav>

    <!-- KONTEN UTAMA PANEL -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

        <!-- TAB 1: PENGATURAN WEB & LOGO -->
        <div id="tab-content-settings" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h3 class="font-serif text-lg font-bold text-navy mb-4 border-b pb-2"><i class="fa-solid fa-image text-gold mr-2"></i>Pengaturan Logo Sekolah</h3>
                <form id="form-logo" onsubmit="saveLogo(event)" class="space-y-4 max-w-xl">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">URL Direct Link Logo (JPG/PNG)</label>
                        <input type="url" id="admin-logo-url" required value="https://i.ibb.co.com/0pG9fmFg/logo-sekolah.jpg" class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                    </div>
                    <button type="submit" class="bg-navy hover:bg-navy-dark text-gold font-bold px-4 py-2 rounded-lg text-xs transition">
                        Simpan Logo
                    </button>
                </form>
            </div>
        </div>

        <!-- TAB 2: KELOLA SOAL & UJIAN -->
        <div id="tab-content-exam" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h3 class="font-serif text-lg font-bold text-navy mb-4 border-b pb-2"><i class="fa-solid fa-plus-circle text-gold mr-2"></i>Tambah Ulangan / Tugas Online</h3>
                <form id="form-exam" onsubmit="addExam(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Judul Ujian / Tugas</label>
                        <input type="text" id="exam-title" required placeholder="Contoh: PTS Matematika Kelas 5" class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Mata Pelajaran & Kelas</label>
                        <input type="text" id="exam-class" required placeholder="Contoh: Matematika - Kelas 5" class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Link Google Form / Soal Ujian</label>
                        <input type="url" id="exam-link" required placeholder="https://forms.google.com/..." class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit" class="bg-gold hover:bg-gold-dark text-navy font-bold px-5 py-2.5 rounded-lg text-xs transition shadow">
                            Publikasikan Ujian ke Portal Siswa
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- TAB 3: KELOLA DATA SISWA -->
        <div id="tab-content-students" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h3 class="font-serif text-lg font-bold text-navy mb-4 border-b pb-2"><i class="fa-solid fa-user-plus text-gold mr-2"></i>Tambah Data Siswa</h3>
                <form id="form-student" onsubmit="addStudent(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">NISN Siswa</label>
                        <input type="text" id="student-nisn" required placeholder="0012345678" class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Nama Lengkap Siswa</label>
                        <input type="text" id="student-name" required placeholder="Ahmad Maulana" class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Kelas</label>
                        <select id="student-class" required class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                            <option value="Kelas 1">Kelas 1</option>
                            <option value="Kelas 2">Kelas 2</option>
                            <option value="Kelas 3">Kelas 3</option>
                            <option value="Kelas 4">Kelas 4</option>
                            <option value="Kelas 5">Kelas 5</option>
                            <option value="Kelas 6">Kelas 6</option>
                        </select>
                    </div>
                    <div class="md:col-span-3">
                        <button type="submit" class="bg-navy hover:bg-navy-dark text-gold font-bold px-4 py-2 rounded-lg text-xs transition">
                            Simpan Data Siswa
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- TAB 4: KELOLA MATA PELAJARAN -->
        <div id="tab-content-subjects" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h3 class="font-serif text-lg font-bold text-navy mb-4 border-b pb-2"><i class="fa-solid fa-book-medical text-gold mr-2"></i>Tambah Mata Pelajaran</h3>
                <form id="form-subject" onsubmit="addSubject(event)" class="flex gap-3 max-w-md">
                    <input type="text" id="subject-name" required placeholder="Nama Mapel (misal: IPAS / PJOK)" class="flex-grow border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                    <button type="submit" class="bg-navy hover:bg-navy-dark text-gold font-bold px-4 py-2 rounded-lg text-xs transition">
                        Tambah Mapel
                    </button>
                </form>
            </div>
        </div>

        <!-- TAB 5: INPUT NILAI SISWA -->
        <div id="tab-content-grades" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h3 class="font-serif text-lg font-bold text-navy mb-4 border-b pb-2"><i class="fa-solid fa-pen-nib text-gold mr-2"></i>Input Nilai Pembelajaran Siswa</h3>
                <form id="form-grade" onsubmit="saveGrade(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Cari NISN Siswa</label>
                        <input type="text" id="grade-nisn" required placeholder="Masukkan NISN" class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Mata Pelajaran</label>
                        <input type="text" id="grade-subject" required placeholder="Contoh: Matematika" class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Nilai Harian</label>
                        <input type="number" id="grade-daily" min="0" max="100" required placeholder="85" class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Nilai Ujian (PTS/PAS)</label>
                        <input type="number" id="grade-exam" min="0" max="100" required placeholder="90" class="w-full border rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-navy">
                    </div>
                    <div class="md:col-span-4">
                        <button type="submit" class="bg-gold hover:bg-gold-dark text-navy font-bold px-5 py-2.5 rounded-lg text-xs transition shadow">
                            Simpan Nilai Siswa
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <!-- SCRIPT TABS INTERAKTIF -->
    <script>
        function switchTab(tabName) {
            // Sembunyikan semua konten tab
            const tabs = ['settings', 'exam', 'students', 'subjects', 'grades'];
            tabs.forEach(t => {
                document.getElementById(`tab-content-${t}`).classList.add('hidden');
                const navBtn = document.getElementById(`nav-${t}`);
                navBtn.className = "tab-btn text-gray-300 hover:text-white font-medium px-4 py-2 rounded-lg text-xs transition flex items-center gap-2";
            });

            // Tampilkan tab pilihan
            document.getElementById(`tab-content-${tabName}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tabName}`);
            activeNav.className = "tab-btn active-tab bg-gold text-navy font-bold px-4 py-2 rounded-lg text-xs transition flex items-center gap-2";
        }

        function saveLogo(e) {
            e.preventDefault();
            alert("Logo berhasil disimpan secara terpusat!");
        }

        function addExam(e) {
            e.preventDefault();
            alert("Ujian/Tugas baru berhasil dipublikasikan ke Portal Siswa!");
        }

        function addStudent(e) {
            e.preventDefault();
            alert("Data Siswa berhasil disimpan!");
        }

        function addSubject(e) {
            e.preventDefault();
            alert("Mata Pelajaran berhasil ditambahkan!");
        }

        function saveGrade(e) {
            e.preventDefault();
            alert("Nilai berhasil disimpan dan terintegrasi dengan pencarian NISN Siswa!");
        }
    </script>
</body>
</html>
